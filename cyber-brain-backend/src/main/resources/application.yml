spring:
  application:
    name: cyber-brain-backend

  # Local dev: set các biến DB_* bên dưới.
  # Production (Render + Neon): chỉ cần set DATABASE_URL dạng
  #   postgres://user:pass@host:port/db?sslmode=require
  # (DatabaseUrlEnvironmentInitializer tự chuyển thành spring.datasource.*)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyberbrain}
    username: ${DB_USERNAME:cyberbrain}
    password: ${DB_PASSWORD:cyberbrain_secret}

  jpa:
    hibernate:
      ddl-auto: validate   # Liquibase quản lý schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

app:
  jwt:
    access-secret: ${JWT_SECRET:dev-only-access-secret-change-me-0123456789abcdef}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-0123456789abcdef}
    access-expiration-ms: 900000       # 15 phút
    refresh-expiration-ms: 604800000   # 7 ngày
  cors:
    # Thêm domain Vercel production khi deploy frontend (env CORS_ALLOWED_ORIGINS)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
