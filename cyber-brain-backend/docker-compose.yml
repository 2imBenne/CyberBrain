services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberbrain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberbrain}
      POSTGRES_USER: ${POSTGRES_USER:-cyberbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberbrain_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberbrain -d cyberbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cyberbrain-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cyberbrain.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
